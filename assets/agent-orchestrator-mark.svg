<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Agent Orchestrator</title>
  <desc id="description">An abstract coordination mark: a central decision point linked to three independent agents.</desc>
  <defs>
    <linearGradient id="orbit" x1="92" y1="92" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42D6C4"/>
      <stop offset="1" stop-color="#4A8DFF"/>
    </linearGradient>
    <linearGradient id="core" x1="190" y1="184" x2="326" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E6D82"/>
      <stop offset="1" stop-color="#263F82"/>
    </linearGradient>
  </defs>

  <!-- One open orbit suggests coordination without imposing a fixed sequence. -->
  <path d="M385 151a174 174 0 1 1-234-24" fill="none" stroke="url(#orbit)" stroke-width="22" stroke-linecap="round"/>
  <path d="m125 91 31 29-39 9" fill="none" stroke="#42D6C4" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three paths converge on a shared decision point. -->
  <path d="m172 166 57 57m111-57-57 57m-27 122v-79" fill="none" stroke="#91AFC1" stroke-width="17" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="69" fill="url(#core)"/>
  <path d="m256 211 45 45-45 45-45-45z" fill="#F4FBFF"/>
  <circle cx="256" cy="256" r="12" fill="#42D6C4"/>

  <!-- Minimal satellite nodes; no literal people or message cards. -->
  <circle cx="158" cy="152" r="27" fill="#F4FBFF"/>
  <circle cx="354" cy="152" r="27" fill="#F4FBFF"/>
  <circle cx="256" cy="374" r="27" fill="#F4FBFF"/>
  <circle cx="158" cy="152" r="10" fill="#42D6C4"/>
  <circle cx="354" cy="152" r="10" fill="#4A8DFF"/>
  <circle cx="256" cy="374" r="10" fill="#42D6C4"/>
</svg>
